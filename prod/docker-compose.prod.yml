services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: reviewer_app/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      LCMS_DATA_DIR: /data
      LCMS_SECRET_KEY: ${LCMS_SECRET_KEY}
      LCMS_MAX_CONTENT_MB: ${LCMS_MAX_CONTENT_MB}
      LCMS_SECURE_COOKIES: ${LCMS_SECURE_COOKIES}
      DATABASE_URL: ${DATABASE_URL}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS}
      GUNICORN_THREADS: ${GUNICORN_THREADS}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE}
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read(); print('ok')\nPY"]
      interval: 20s
      timeout: 10s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "4444:4444"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4444/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  app_data:
